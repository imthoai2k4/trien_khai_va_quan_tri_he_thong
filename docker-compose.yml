services:
  # 1. Ứng dụng Node.js (Backend + Frontend)
  app:
    build:
      context: ./app
    container_name: tkpm_app
    environment:
      - NODE_ENV=production
      - APP_PORT=3000
      - MYSQL_HOST=db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DATABASE=movie_ticket
      - JWT_SECRET=super_secret_jwt_key_for_prod
    # KHÔNG dùng ports ở đây, chỉ expose qua Nginx
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tkpm_network

  # 2. Cơ sở dữ liệu MySQL
  db:
    image: mysql:8.0
    container_name: tkpm_db
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=movie_ticket
    # Ánh xạ init script để tự động chạy khi tạo volume mới
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/1-init.sql
      - ./database/sample-data.sql:/docker-entrypoint-initdb.d/2-sample-data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tkpm_network

  # 3. Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: tkpm_nginx
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      # Chứng chỉ tự ký cho demo HTTPS (Task 10).
      # Mount read-only để Nginx không bao giờ ghi đè private key.
      # Thư mục này chỉ chứa .gitkeep là đủ cho chế độ HTTP hiện tại; Nginx chỉ
      # thực sự đọc tới nó khi `nginx/conf.d/default-ssl.conf` được bật.
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      # Cổng 443 chỉ thực sự phục vụ sau khi bật default-ssl.conf (xem README).
      # Việc ánh xạ sẵn cổng không ảnh hưởng chế độ HTTP hiện tại.
      - "443:443"
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - tkpm_network

  # 4. phpMyAdmin (Giới hạn cổng, chỉ dùng cho nội bộ/admin)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: tkpm_pma
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=root
    ports:
      - "8080:80"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - tkpm_network

  # 5. Prometheus Monitoring (Task 11)
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: tkpm_prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - tkpm_network

  # 6. cAdvisor — Giám sát tài nguyên container (Task 12)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: tkpm_cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - tkpm_network

  # 7. MySQL Exporter — Giám sát hiệu năng Database (Task 12)
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: tkpm_mysqld_exporter
    environment:
      - MYSQL_USER=${DB_USER:-root}
      - MYSQL_PASSWORD=${DB_PASS:-root}
      - MYSQL_HOST=db
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "[client]" > /tmp/.my.cnf
        echo "user=$$MYSQL_USER" >> /tmp/.my.cnf
        echo "password=$$MYSQL_PASSWORD" >> /tmp/.my.cnf
        echo "host=$$MYSQL_HOST" >> /tmp/.my.cnf
        echo "port=3306" >> /tmp/.my.cnf
        exec /bin/mysqld_exporter --config.my-cnf=/tmp/.my.cnf --web.listen-address=:9104
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "9104"
    restart: unless-stopped
    networks:
      - tkpm_network

  # 8. Grafana — Dashboard trực quan hóa (Task 12)
  grafana:
    image: grafana/grafana:11.1.0
    container_name: tkpm_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION=true
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - tkpm_network

  # 9. Loki — Kho lưu trữ log tập trung (Task 13)
  loki:
    image: grafana/loki:3.1.0
    container_name: tkpm_loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./logging/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    # CHỈ mở nội bộ trong tkpm_network: Promtail đẩy log vào, Grafana đọc ra.
    # Tuyệt đối không publish cổng 3100 ra host (docs/DECISIONS.md mục 8).
    expose:
      - "3100"
    restart: unless-stopped
    networks:
      - tkpm_network

  # 10. Promtail — Thu thập log container và đẩy về Loki (Task 13)
  promtail:
    image: grafana/promtail:3.1.0
    container_name: tkpm_promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./logging/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      # Đọc log qua Docker API. Mount read-only để Promtail không thể điều
      # khiển Docker daemon. Trên Docker Desktop cho Windows, đây là cách duy
      # nhất truy cập được log container (thư mục log thật nằm trong máy ảo).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Ghi nhớ vị trí đã đọc của từng container, tránh đọc lại toàn bộ lịch
      # sử log mỗi khi Promtail được tạo lại.
      - promtail_positions:/var/promtail
    # Không expose cổng: Promtail chỉ hoạt động theo chiều đẩy log sang Loki.
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - tkpm_network

volumes:
  db_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:

networks:
  tkpm_network:
    driver: bridge
