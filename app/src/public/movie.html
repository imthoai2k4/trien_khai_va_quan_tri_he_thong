<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chi tiết phim và chọn suất chiếu — TKPM Cinema." />
  <title>Chi tiết phim — TKPM Cinema</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar" role="navigation" aria-label="Điều hướng chính">
    <div class="container navbar__inner">
      <a class="navbar__logo" href="index.html" aria-label="TKPM Cinema - Trang chủ">
        <div class="navbar__logo-icon" aria-hidden="true">🎬</div>
        <div class="navbar__logo-text">TKPM<span>Cinema</span></div>
      </a>
      <div class="navbar__nav">
        <a class="navbar__link" href="index.html">Phim</a>
        <span class="navbar__demo-badge" aria-label="Phiên bản demo">DEMO</span>
      </div>
    </div>
  </nav>

  <main class="page-content" id="main-content">
    <div class="container">

      <!-- Breadcrumb -->
      <nav aria-label="Breadcrumb" style="margin-bottom:1.5rem">
        <ol style="display:flex;gap:.5rem;align-items:center;font-size:.875rem;color:var(--text-muted);list-style:none">
          <li><a href="index.html" style="color:var(--text-muted)">🏠 Trang chủ</a></li>
          <li aria-hidden="true" style="opacity:.4">/</li>
          <li style="color:var(--text-primary)" id="breadcrumb-title">Chi tiết phim</li>
        </ol>
      </nav>

      <!-- Demo Banner -->
      <div class="demo-banner" role="note">
        <span aria-hidden="true">⚠️</span>
        <span><strong>Giao diện demo.</strong> Suất chiếu và giá vé là dữ liệu mẫu.</span>
      </div>

      <!-- Progress Steps -->
      <div class="progress-steps" role="list" aria-label="Bước đặt vé">
        <div class="step active" role="listitem">
          <div class="step__dot" aria-current="step">1</div>
          <span class="step__label">Chọn phim</span>
        </div>
        <div class="step-connector" aria-hidden="true"></div>
        <div class="step" role="listitem">
          <div class="step__dot">2</div>
          <span class="step__label">Chọn ghế</span>
        </div>
        <div class="step-connector" aria-hidden="true"></div>
        <div class="step" role="listitem">
          <div class="step__dot">3</div>
          <span class="step__label">Thanh toán</span>
        </div>
        <div class="step-connector" aria-hidden="true"></div>
        <div class="step" role="listitem">
          <div class="step__dot">4</div>
          <span class="step__label">Xác nhận</span>
        </div>
      </div>

      <!-- Movie Detail -->
      <div class="movie-detail-layout">
        <!-- Poster -->
        <div>
          <div class="movie-poster">
            <img id="movie-poster" src="" alt="" />
          </div>
        </div>

        <!-- Info -->
        <div>
          <h1 class="movie-info__title" id="movie-title">Đang tải...</h1>
          <div class="movie-info__meta" id="movie-meta"></div>
          <p class="movie-info__description" id="movie-description"></p>

          <!-- Showtimes -->
          <section aria-labelledby="showtime-heading">
            <div class="section-header" style="margin-bottom:1rem">
              <div>
                <p class="section-header__eyebrow">Lịch chiếu</p>
                <h2 id="showtime-heading" style="font-size:1.25rem">Chọn suất chiếu</h2>
              </div>
            </div>
            <div id="showtimes-container" aria-live="polite"></div>
          </section>

          <!-- CTA -->
          <div style="margin-top:2rem">
            <button
              class="btn btn--primary btn--lg"
              id="book-now-btn"
              aria-disabled="true"
              disabled
            >
              🎟️ Chọn ghế →
            </button>
            <a href="index.html" class="btn btn--ghost" style="margin-left:.75rem">← Quay lại</a>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="footer" role="contentinfo">
    <div class="container footer__inner">
      <span class="footer__brand">🎬 TKPM Cinema</span>
      <span class="footer__text">© 2026 TKPM Cinema. Dữ liệu demo — Task 3.</span>
    </div>
  </footer>

  <div id="toast-container" class="toast-container" role="region" aria-label="Thông báo" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
