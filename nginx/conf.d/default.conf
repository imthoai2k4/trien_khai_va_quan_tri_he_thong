# ==============================================================================
# Nginx reverse proxy — TKPM Cinema
# Task 10: Hardening (security headers, giới hạn request, xử lý lỗi proxy)
#
# File này là phương án HTTP (cổng 80) và LUÔN hoạt động — đây là cấu hình mặc
# định của repository. HTTPS tự ký là tùy chọn cho demo, xem:
#     nginx/conf.d/default-ssl.conf.example
#
# Lưu ý về `add_header`: một `location` có khai báo `add_header` riêng sẽ GHI ĐÈ
# toàn bộ `add_header` kế thừa từ `server`. Vì vậy toàn bộ security header được
# khai báo DUY NHẤT ở cấp `server` và không location nào khai báo lại, nhờ đó
# không sinh header trùng lặp và header vẫn áp dụng cho cả phản hồi lỗi.
# ==============================================================================

# Không hiển thị phiên bản Nginx trên header `Server` và trang lỗi mặc định.
server_tokens off;

# ------------------------------------------------------------------------------
# Giới hạn request ở cấp http (áp dụng cho mọi server block trong file này).
# 1m là mức rộng rãi cho các API JSON hiện có (đăng nhập, đặt vé, thanh toán
# giả lập đều có payload rất nhỏ) nhưng vẫn chặn được payload bất thường.
#
# Lưu ý: KHÔNG khai báo lại `keepalive_timeout` ở đây vì http-level của
# /etc/nginx/nginx.conf (image gốc) đã đặt `keepalive_timeout 65;` — khai báo
# trùng trong cùng context sẽ khiến Nginx báo lỗi "directive is duplicate".
# ------------------------------------------------------------------------------
client_max_body_size    1m;
client_body_timeout     15s;
client_header_timeout   15s;
large_client_header_buffers 4 16k;
send_timeout            30s;

server {
    listen      80;
    server_name localhost;

    # --------------------------------------------------------------------------
    # 1. Security headers (Task 10 — mục 7 của docs/DECISIONS.md).
    #    `always` bảo đảm header xuất hiện trên cả phản hồi lỗi (4xx/5xx).
    # --------------------------------------------------------------------------
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "0" always;

    # CSP: chính sách chặt theo `default-src 'self'`, chỉ mở đúng những nguồn mà
    # giao diện hiện tại thực sự dùng:
    #   - style-src: 'unsafe-inline' vì giao diện dùng thuộc tính `style=` và
    #     một khối <style> trong admin.html; thêm fonts.googleapis.com cho
    #     @import Google Fonts trong css/style.css.
    #   - font-src : fonts.gstatic.com là nơi Google Fonts phục vụ file font.
    #   - img-src  : poster phim demo lấy từ images.unsplash.com.
    #   - script-src giữ nghiêm ngặt 'self' — giao diện không có script inline
    #     và không có thuộc tính sự kiện inline (onclick/...).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    # KHÔNG khai báo Strict-Transport-Security ở đây: server này phục vụ HTTP
    # thuần, bật HSTS trên HTTP là sai và có thể khiến trình duyệt khóa domain.
    # HSTS chỉ được bật trong `default-ssl.conf.example` (server block HTTPS).

    # --------------------------------------------------------------------------
    # 2. Xử lý lỗi upstream an toàn (502/503/504).
    #    - `proxy_intercept_errors on` (đặt trong location) khiến Nginx không
    #      chuyển tiếp nguyên văn phản hồi lỗi của upstream cho người dùng.
    #    - Ứng dụng Express hiện chỉ trả 4xx/500 nên việc chặn 502/503/504
    #      không che mất phản hồi nghiệp vụ hợp lệ nào.
    #    - Mỗi mã lỗi có một named location riêng để GIỮ NGUYÊN mã trạng thái.
    #    - Nội dung trả về là văn bản ngắn, không chứa đường dẫn hệ thống, tên
    #      container, phiên bản phần mềm hay chi tiết cấu hình nội bộ.
    # --------------------------------------------------------------------------
    error_page 502 = @upstream_502;
    error_page 503 = @upstream_503;
    error_page 504 = @upstream_504;

    location @upstream_502 {
        default_type text/plain;
        return 502 "502 Bad Gateway - khong ket noi duoc toi dich vu ung dung.\n";
    }

    location @upstream_503 {
        default_type text/plain;
        return 503 "503 Service Unavailable - dich vu tam thoi khong kha dung.\n";
    }

    location @upstream_504 {
        default_type text/plain;
        return 504 "504 Gateway Timeout - dich vu ung dung phan hoi qua cham.\n";
    }

    # --------------------------------------------------------------------------
    # 3. Reverse proxy tới Node.js App (giữ nguyên hành vi Task 9).
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        # Timeout: đủ rộng cho truy vấn DB bình thường nhưng không để kết nối
        # treo vô hạn khi upstream không phản hồi.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Chuyển tiếp thông tin client cho upstream.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / upgrade (giữ nguyên cấu hình Task 9).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Không chuyển tiếp trang lỗi nội bộ của upstream ra ngoài.
        proxy_intercept_errors on;
    }
}
